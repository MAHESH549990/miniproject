<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome · Saffron & Stone</title><link rel="stylesheet" href="index.css"><link rel="stylesheet" href="theme.css"><script src="lo.js" defer></script>  <link rel="stylesheet" href="polish.css">
</head><body><main class="Login"><p class="eyebrow">SAFFRON & STONE · EVERYDAY GOODNESS</p><h1>Welcome</h1><h4>Sign in to order your favourites.</h4><form id="loginForm"><label for="email">Email address</label><input type="email" id="email" placeholder="you@example.com" autocomplete="email" required><label for="password">Password</label><input type="password" id="password" placeholder="At least 8 characters" autocomplete="current-password" minlength="8" required><button type="submit">Continue to menu</button></form><p class="form-note">First time here? Your account is created on this device when you continue.</p><nav class="login-links"><a href="adminlogin.html">Administrator sign in →</a></nav></main><script>
async function passwordHash(password,salt){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)),iterations:150000,hash:'SHA-256'},key,256);return btoa(String.fromCharCode(...new Uint8Array(bits)));}
document.getElementById('loginForm').addEventListener('submit',async event=>{event.preventDefault();const email=document.getElementById('email').value.trim().toLowerCase();const password=document.getElementById('password').value;if(password.length<8)return alert('Use a password with at least 8 characters.');const button=event.currentTarget.querySelector('button');button.disabled=true;try{const users=readStore('users',[]);let user=users.find(entry=>entry.email===email);if(user?.passwordHash){const attempt=await passwordHash(password,user.passwordSalt);if(attempt!==user.passwordHash){alert('Email or password is incorrect.');return;}}else{const saltBytes=crypto.getRandomValues(new Uint8Array(16));const salt=btoa(String.fromCharCode(...saltBytes));user=user||{email};delete user.password;user.passwordSalt=salt;user.passwordHash=await passwordHash(password,salt);if(!users.some(entry=>entry.email===email))users.push(user);}user.lastVisit=new Date().toISOString();writeStore('users',users);localStorage.setItem('currentUser',email);location.href='lo.html';}catch(error){alert('Sign in is unavailable in this browser. Open the site over HTTPS or through localhost and try again.');}finally{button.disabled=false;}});
</script></body></html>
