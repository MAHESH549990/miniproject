<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your cart · Saffron & Stone</title><link rel="stylesheet" href="cart.css"><link rel="stylesheet" href="theme.css"><script src="lo.js"></script>  <link rel="stylesheet" href="polish.css">
</head>
<body><main class="page-shell"><a class="back-link" href="lo.html">← Back to menu</a><p class="eyebrow">YOUR SELECTION</p><h1>Your cart</h1><p class="page-intro">Review your dishes before you place the order.</p><div class="table-wrap"><table id="cartTable"><thead><tr><th>Dish</th><th>Price</th><th>Quantity</th><th>Total</th><th></th></tr></thead><tbody></tbody></table></div><div class="cart-footer"><p id="cartTotal"></p><div class="cart-buttons"><a class="button button-secondary" href="lo.html">Continue browsing</a><button class="button" id="checkoutButton">Place order</button></div></div></main>
<script>
const body=document.querySelector('#cartTable tbody');
function renderCart(){const cart=getCart();body.replaceChildren();if(!cart.length){const row=body.insertRow();const cell=row.insertCell();cell.colSpan=5;cell.textContent='Your cart is empty. Pick something delicious from the menu.';document.getElementById('cartTotal').textContent='';return;}let sum=0;cart.forEach((item,index)=>{const row=body.insertRow();[item.name,money(item.price),String(item.quantity),money(item.price*item.quantity)].forEach(value=>{const cell=row.insertCell();cell.textContent=value;});const action=row.insertCell();const remove=document.createElement('button');remove.className='text-button';remove.textContent='Remove';remove.onclick=()=>{cart.splice(index,1);saveCart(cart);renderCart();};action.append(remove);sum+=item.price*item.quantity;});document.getElementById('cartTotal').textContent=`Total · ${money(sum)}`;}
document.getElementById('checkoutButton').addEventListener('click',()=>{if(!requireCustomer())return;const cart=getCart();if(!cart.length)return alert('Your cart is empty.');cart.forEach(item=>placeOrder(item,item.quantity));saveCart([]);alert('Your order has been received.');location.href='orders.html';});renderCart();
</script></body></html>
