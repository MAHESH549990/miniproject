<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin dashboard · Saffron & Stone</title><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="theme.css">  <link rel="stylesheet" href="polish.css">
</head><body id="adminDashboard"><header class="admin-header"><div><p class="eyebrow">SAFFRON & STONE</p><h1>Dashboard</h1></div><nav class="nav-links"><a href="lo.html">View menu</a><button id="adminLogout" class="button-secondary">Sign out</button></nav></header><main class="admin-container"><section class="food-actions"><div><p class="eyebrow">MENU MANAGEMENT</p><h2>Add a dish</h2><p>Keep the menu fresh with a new favourite.</p></div><div class="admin-form-grid"><label>Dish name<input type="text" id="foodName" placeholder="e.g. Masala dosa"></label><label>Price in rupees<input type="number" id="foodPrice" placeholder="180" min="1" step="1"></label><label class="image-field">Dish photo <span>Optional · max 700 KB</span><input type="file" id="foodImg" accept="image/*"></label><button class="button" onclick="addFood()">Add to menu</button></div><div class="admin-remove"><label for="removeName">Remove a dish</label><input type="text" id="removeName" placeholder="Dish name"><button class="button button-secondary" onclick="removeFood()">Remove dish</button></div></section><section class="food-list"><p class="eyebrow">AVAILABLE NOW</p><h2>Current menu</h2><div class="table-wrap"><table id="foodTable"><thead><tr><th>#</th><th>Dish</th><th>Price</th></tr></thead><tbody></tbody></table></div></section><section class="customer-list"><p class="eyebrow">CUSTOMER ACTIVITY</p><h2>Visits &amp; orders</h2><div class="table-wrap"><table id="customerTable"><thead><tr><th>#</th><th>Email</th><th>Last visit</th><th>Orders</th></tr></thead><tbody></tbody></table></div></section></main><script src="lo.js"></script><script>document.getElementById('adminLogout').addEventListener('click',()=>{sessionStorage.removeItem('adminAuthenticated');location.href='adminlogin.html';});</script></body></html>
