<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirm order · Saffron & Stone</title><link rel="stylesheet" href="placeorder.css"><link rel="stylesheet" href="theme.css"><script src="lo.js"></script>  <link rel="stylesheet" href="polish.css">
</head><body><main class="order-box page-shell"><a class="back-link" href="lo.html">← Back to menu</a><p class="eyebrow">MADE FRESH FOR YOU</p><h1>Confirm your order</h1><section class="item-info"><h2 id="itemName">Loading dish…</h2><p id="itemPrice"></p></section><label for="qty">Quantity</label><input type="number" id="qty" value="1" min="1" max="50"><p class="order-summary" id="orderSummary"></p><div class="buttons"><button class="button" id="placeButton">Place order</button><button class="button button-secondary" id="cartButton">Add to cart</button></div></main><script>
const item=(()=>{try{return JSON.parse(localStorage.getItem('selectedItem'));}catch{return null;}})();const name=document.getElementById('itemName'),price=document.getElementById('itemPrice'),summary=document.getElementById('orderSummary');if(item){name.textContent=item.name;price.textContent=money(item.price)+' each';}else{name.textContent='No dish selected';}
function quantity(){const input=document.getElementById('qty');const value=Number(input.value);if(!Number.isInteger(value)||value<1||value>50){alert('Choose a quantity from 1 to 50.');input.focus();return null;}return value;}
document.getElementById('placeButton').onclick=()=>{const qty=quantity();if(!item||!qty)return;if(!placeOrder(item,qty))return;summary.textContent=`Order received · ${qty} × ${item.name} · ${money(item.price*qty)}`;setTimeout(()=>location.href='orders.html',900);};document.getElementById('cartButton').onclick=()=>{const qty=quantity();if(!item||!qty)return;if(addToCart(item,qty)){summary.textContent=`Added ${qty} × ${item.name} to your cart.`;setTimeout(()=>location.href='cart.html',700);}};
</script></body></html>
