<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your orders · Saffron & Stone</title><link rel="stylesheet" href="orders.css"><link rel="stylesheet" href="theme.css"><script src="lo.js"></script>  <link rel="stylesheet" href="polish.css">
</head><body><main class="page-shell"><a class="back-link" href="lo.html">← Back to menu</a><p class="eyebrow">MADE WITH CARE</p><h1>Your orders</h1><p class="page-intro">Your recent dishes and order updates.</p><div class="table-wrap"><table id="ordersTable"><thead><tr><th>Dish</th><th>Price</th><th>Qty</th><th>Total</th><th>Placed</th><th>Status</th></tr></thead><tbody></tbody></table></div><p id="orderTotal" class="order-total"></p></main><script>
const body=document.querySelector('#ordersTable tbody');const currentUser=getCurrentUser();const records=readStore('userOrders',[]).find(entry=>entry.email===currentUser)?.orders||[];if(!currentUser){const row=body.insertRow();const cell=row.insertCell();cell.colSpan=6;cell.textContent='Please sign in to view your orders.';}else if(!records.length){const row=body.insertRow();const cell=row.insertCell();cell.colSpan=6;cell.textContent='No orders yet. Your next favourite is waiting.';}else{let total=0;records.slice().reverse().forEach(order=>{const row=body.insertRow();[order.name,money(order.price),String(order.quantity||1),money(order.total??order.price),new Date(order.time).toLocaleString(),order.status||'Received'].forEach(value=>{const cell=row.insertCell();cell.textContent=value;});total+=Number(order.total??order.price);});document.getElementById('orderTotal').textContent=`Order total · ${money(total)}`;}
</script></body></html>
