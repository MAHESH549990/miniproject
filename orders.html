<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Orders</title>
  <link rel="stylesheet" href="orders.css">
</head>
<body>

  <h1>Your Orders</h1>

  <table id="ordersTable">
    <thead>
      <tr>
        <th>Item Name</th>
        <th>Price (₹)</th>
        <th>Quantity</th>
        <th>Total (₹)</th>
        <th>Order Time</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <button onclick="window.location.href='lo.html'">⬅ Back to Menu</button>

  <script>
    const currentUser = localStorage.getItem("currentUser");
    const tbody = document.querySelector("#ordersTable tbody");

    if (!currentUser) {
      tbody.innerHTML = `
        <tr>
          <td colspan="5" style="text-align:center;">⚠️ Please login first</td>
        </tr>`;
    } else {
      const allOrders = JSON.parse(localStorage.getItem("userOrders")) || [];
      const user = allOrders.find(u => u.email === currentUser);

      if (!user || user.orders.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" style="text-align:center;">📦 No orders placed yet</td>
          </tr>`;
      } else {
        let grandTotal = 0;

        user.orders.forEach(order => {
          const qty = order.quantity ?? 1;
          const total = order.total ?? order.price;
          grandTotal += total;

          tbody.innerHTML += `
            <tr>
              <td>${order.name}</td>
              <td>${order.price}</td>
              <td>${qty}</td>
              <td>${total}</td>
              <td>${order.time}</td>
            </tr>`;
        });

        // Grand total row
        tbody.innerHTML += `
          <tr class="grand-total">
            <td colspan="3"><strong>Grand Total</strong></td>
            <td colspan="2"><strong>₹${grandTotal}</strong></td>
          </tr>`;
      }
    }
  </script>

</body>
</html>
